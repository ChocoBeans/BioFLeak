# Dependencies of the federated app (keep in sync with ../requirements.txt).
#
# The simulation is launched in-process by `python -m federated.run` (flwr.simulation.run_simulation),
# not with `flwr run`: `flwr run` installs a private copy of the app into ~/.flwr and builds a fresh
# Python environment for every run (minutes each), and that copy cannot import ../utils or ../models.
# Hyperparameters therefore travel in the per-round config messages (see server_app.py), and the
# Flower app/federation sections of the original quickstart example were removed.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biofleak-federated"
version = "0.1.0"
description = "FedAvg over the four CLL cohorts (BioFLeak)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.39.0,<1.40",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "opacus>=1.4.0",
    "matplotlib>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
